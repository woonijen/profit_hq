# Runs the production build of the whole app locally: http://localhost:8080
#   cp backend/.env.example backend/.env   (fill in MONGODB_URI and the two JWT secrets)
#   docker compose up --build
# MongoDB is not included; it stays on Atlas (MONGODB_URI in backend/.env).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      NODE_ENV: production
      PORT: '4000'
      # The browser talks to nginx on :8080, which is the origin the API sees in CORS checks.
      CLIENT_ORIGIN: http://localhost:8080
      # This demo is served over plain http, where a Secure cookie would be refused. A real
      # deployment sits behind https and must leave this unset (= on).
      COOKIE_SECURE: 'false'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
