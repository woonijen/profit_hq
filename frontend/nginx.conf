server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Headers for the app. (Do not add `add_header` inside the locations below: nginx would then
  # drop these.)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # The API container. `Host` and the client address are passed on so the API can log them
  # (it trusts exactly one proxy hop).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Build output has content hashes in the file names: cache forever.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Single-page app: unknown paths are client-side routes. index.html itself is never cached,
  # so a new deploy is picked up on the next load.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
